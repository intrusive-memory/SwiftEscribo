# SwiftLint Configuration for SwiftEscribo
# Enforces macOS/iOS 26.0+ minimum deployment target, and this package's three
# structural rules: no regex in the scanners, no UI imports in EscriboCore, and
# no `import Markdown` anywhere under Sources/.

excluded:
  - .build
  - DerivedData
  - .swiftpm

# Disabled rules (to focus on platform and architecture enforcement,
# not code style)
disabled_rules:
  - identifier_name
  - force_cast
  - trailing_comma
  - redundant_string_enum_value
  - function_parameter_count
  - function_body_length
  - type_body_length
  - file_length
  - line_length
  - cyclomatic_complexity
  - for_where
  - shorthand_operator
  # Sortie 29, when `make lint` first became a gate that anything actually ran.
  #
  # `large_tuple` fires 17 times in this tree, and all 17 are under `Tests/` — zero in
  # `Sources/`. Sixteen are warnings (3-member tuples) and one is an *error*: the
  # 4-member `(range:kind:role:covers:)` expectation table at
  # `Tests/EscriboCoreTests/FountainInMarkdownTests.swift:81`. That single site is the
  # only default-rule violation anywhere in the package that carries `error` severity,
  # so left enabled it alone decides whether the lint gate is red — on a point of
  # taste this file's own header explicitly declines to police ("platform and
  # architecture enforcement, not code style"). Every one of the 17 is a labelled
  # tuple used as a test expectation table, which is the clearest available spelling
  # of that construct; SwiftLint's 2-member ceiling is aimed at unlabelled return
  # tuples, not tables.
  #
  # Recorded here rather than silenced at the call sites because they are under
  # `Tests/`, which Sortie 29 does not own. Sortie 30 may re-enable this and
  # restructure the tuples if it disagrees; the count and the locations are written
  # down so that decision starts from data rather than a rediscovery.
  - large_tuple

opt_in_rules:
  - unavailable_function

custom_rules:
  # Prevent @available with macOS/iOS versions < 26
  no_old_availability_attribute:
    regex: '@available\s*\(\s*(macOS|iOS)\s+(1?[0-9]|2[0-5])(\.[0-9]+)?\s*,'
    match_kinds:
      - attribute.builtin
    message: "Use @available(macOS 26.0, *) or @available(iOS 26.0, *). Versions < 26 are not supported."
    severity: error

  # Prevent #available with macOS/iOS versions < 26
  no_old_availability_check:
    regex: '#available\s*\(\s*(macOS|iOS)\s+(1?[0-9]|2[0-5])(\.[0-9]+)?'
    message: "Use #available(macOS 26, *) or #available(iOS 26, *). Versions < 26 are not supported."
    severity: error

  # Prevent #unavailable with macOS/iOS versions < 26
  no_old_unavailability_check:
    regex: '#unavailable\s*\(\s*(macOS|iOS)\s+(1?[0-9]|2[0-5])(\.[0-9]+)?'
    message: "Use #unavailable(macOS 26, *) or #unavailable(iOS 26, *). Versions < 26 are not supported."
    severity: error

  # The whole point of this package is replacing a regex-based Fountain parser.
  # Regex cannot meet the per-keystroke budget and is what made the old parser
  # buggy. Scanners must be hand-written line scanning.
  no_regex_in_scanners:
    included: 'Sources/EscriboCore/.*'
    regex: '(NSRegularExpression|\.regularExpression|Regex\s*<|#/|try!\s*Regex)'
    message: "No regular expressions in EscriboCore. Scanners must be hand-written line scanning — see AGENTS.md."
    severity: error

  # EscriboCore must stay linkable from CLI tools and servers.
  no_ui_imports_in_core:
    included: 'Sources/EscriboCore/.*'
    regex: '^\s*import\s+(SwiftUI|AppKit|UIKit)\b'
    message: "EscriboCore must import Foundation only — no SwiftUI/AppKit/UIKit. Put UI code in Sources/SwiftEscribo."
    severity: error

  # `swift-markdown` is the CommonMark/GFM differential oracle for MarkdownGrammar
  # and is declared on `EscriboCoreTests` only. This rule is the thing that keeps it
  # there, and it exists because SwiftPM will not.
  #
  # SwiftPM prunes a test-only dependency out of a downstream consumer's graph as a
  # *graph property* — it is pruned because no shipping target happens to reference
  # it — not because anything in Package.swift declares it test-only. There is no
  # `testOnly:` to write, and no diagnostic when the property stops holding:
  # https://github.com/swiftlang/swift-package-manager/issues/7007
  #
  # So the day any target under Sources/ says `import Markdown`, swift-markdown (and
  # swift-cmark under it) silently becomes a dependency of every consumer of the
  # Fountain parser, the zero-dependency charter in AGENTS.md breaks, and the build
  # stays green. The failure is invisible at exactly the moment it is introduced,
  # which is why it is guarded at the import site rather than at the resolution site
  # (EXECUTION_PLAN.md § D-2: no throwaway consumer package, no CI resolution guard).
  #
  # Scoped to Sources/ deliberately — Tests/EscriboCoreTests is where the import
  # belongs and must keep working.
  no_markdown_import_in_sources:
    included: 'Sources/.*'
    regex: '^\s*(@testable\s+)?import\s+Markdown\b'
    message: "swift-markdown is a test-only differential oracle. `import Markdown` under Sources/ makes it a dependency of every consumer, silently — SwiftPM will not warn. Keep it in Tests/EscriboCoreTests."
    severity: error
